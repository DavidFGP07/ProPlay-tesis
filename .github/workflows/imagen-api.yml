# Imagen de la API para el despliegue en Azure (docs/operacion.md, «Despliegue en Azure»).
#
# Cuando el CI de un push a main termina en verde, construye apps/api/Dockerfile
# y la publica en ghcr.io/<propietario>/proplay-api con dos etiquetas: `latest`
# y el SHA del commit. Azure no se actualiza solo: el despliegue de una imagen
# nueva es `bash apps/api/scripts/azure.sh actualizar`.
name: Imagen de la API

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: imagen-api
  cancel-in-progress: false

jobs:
  publicar:
    name: construir y publicar en ghcr.io
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    env:
      COMMIT: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.COMMIT }}

      - name: Nombre de la imagen (ghcr exige minúsculas)
        run: echo "IMAGEN=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/proplay-api" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGEN }}:latest
            ${{ env.IMAGEN }}:${{ env.COMMIT }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ env.COMMIT }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
